name: Manual Playlist Updater

on:
  workflow_dispatch: # এটি ম্যানুয়ালি রান করার অপশন তৈরি করবে

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Script to Check & Update
        run: python generate.py  # আপনার মেইন পাইথন কোডের নাম দেওয়া হয়েছে

      - name: Save (Commit) Updated Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add channels.txt combined_playlist.m3u
          git commit -m "Auto-removed dead and duplicate links" || exit 0
          git push
